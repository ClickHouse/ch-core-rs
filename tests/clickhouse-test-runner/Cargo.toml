[package]
name = "clickhouse-test-runner"
version = "0.0.0"
description = "Runs the ClickHouse core SQL tests through ch-core-rs"
edition = "2024"
license = "Apache-2.0"
publish = false

# This package is not a member of the root workspace: it has its own lock file
# and target directory, and the CI jobs of the library (fmt + clippy + test,
# MSRV check) do not build it.
[workspace]

[lints.rust]
unreachable_pub = "warn"

[dependencies]
ch-core-rs = { path = "../.." }
# The TCP transport: the sans-I/O engine of this repository, driven over a
# blocking socket.
ch-tcp-proto = { path = "../../crates/ch-tcp-proto" }
# The HTTP transport of the shim. The library has no transport; a binding
# owns it (INTEGRATING.md).
ureq = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
