[package]
name = "ch-core-rs"
version = "0.2.0"
edition = "2021"
# The ffi module's abort-on-unwind contract relies on extern "C" unwind abort
# semantics guaranteed from Rust 1.81.
rust-version = "1.81"
description = "Zero-dependency ClickHouse FORMAT Native columnar codec core"
license = "Apache-2.0"
repository = "https://github.com/ClickHouse/ch-core-rs"
readme = "README.md"
# Distributed as a git dependency pinned to a release tag, never via crates.io
# (see the distribution plan in the clickhouse-connect repo). This guards
# against an accidental `cargo publish`.
publish = false

# Test and bench only, never linked into the library. liblz4 (through the
# safe `lz4` wrapper over `lz4-sys`) is the reference implementation for the
# LZ4 differential tests and the `lz4_parity` bench.
[dev-dependencies]
lz4 = "1.28"

[[bench]]
name = "lz4_parity"
harness = false
