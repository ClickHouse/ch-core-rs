name: Upstream SQL tests

# Runs a curated subset of the ClickHouse core SQL tests
# (tests/queries/0_stateless) through ch-core-rs, over HTTP and over the
# native TCP protocol. See tests/clickhouse-test-runner/README.md.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: "ClickHouse version to try, for example 26.11.1.10 (default: tests/clickhouse-test-runner/clickhouse-version)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - "tests/clickhouse-test-runner/**"
      - ".github/workflows/upstream-sql-tests.yml"
  pull_request:
    paths:
      - "tests/clickhouse-test-runner/**"
      - ".github/workflows/upstream-sql-tests.yml"

# A new push to a pull request cancels its older run. Other runs (nightly,
# manual tries of other versions, pushes to main) never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The harness is a Cargo package of its own (not a member of the root
  # workspace), so the jobs of ci.yml do not build it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/clickhouse-test-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # rust-toolchain.toml in the root of the repository selects the
      # toolchain and its components (rustfmt, clippy).
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/clickhouse-test-runner

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests of the harness
        run: cargo test

  upstream-sql-tests:
    name: upstream-sql-tests (${{ matrix.protocol }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        protocol: [http, tcp]
        # Round-robin shards of the allowlist, about 2,600 tests each. The
        # full list of one protocol takes about 10 minutes at -j 6 on 32
        # vCPUs, and one shard about 3 minutes at -j 4 on 4 vCPUs. Change
        # SHARD_TOTAL below together with this list.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/clickhouse-test-runner

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies of tests/clickhouse-test
        run: pip install jinja2

      # The server version and the upstream tests are pinned together in
      # tests/clickhouse-test-runner/clickhouse-version: the `.reference`
      # files of another release do not match the output of the server. A
      # new server release changes nothing here until a pull request bumps
      # the pin. The `clickhouse_version` input of a manual run tries
      # another version without a commit.
      - name: Select the ClickHouse version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.clickhouse_version }}
        run: |
          version="${INPUT_VERSION:-$(tests/clickhouse-test-runner/scripts/pinned-version.sh)}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::clickhouse_version must be a full version such as 26.10.4.207 (got: '${version}')"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ -z "${INPUT_VERSION}" ]]; then
            echo "pinned=true" >> "${GITHUB_OUTPUT}"
          fi

      # The stock server configuration. CLICKHOUSE_SKIP_USER_SETUP keeps the
      # `default` user of the image's users.xml: network access, access
      # management and named-collection control (tests create users, roles
      # and named collections). Without it, the image allows the user without
      # a password only from localhost in the container.
      #
      # The server gets the host name of the runner: tests/clickhouse-test
      # replaces its own host name with `localhost` in the output of each
      # test, and some `.reference` files have `localhost` for hostName().
      #
      # The shim renders DateTime values with the embedded time zone
      # database of chrono-tz, not the system one, so the runner needs no
      # tzdata-legacy.
      - name: Start ClickHouse ${{ steps.version.outputs.version }}
        env:
          CLICKHOUSE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name clickhouse -p 8123:8123 -p 9000:9000 \
            --hostname "$(hostname)" \
            --ulimit nofile=262144:262144 -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            "clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}"
          for _ in $(seq 1 60); do
            if curl -fsS "http""://localhost:8123/ping" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs clickhouse
          echo "::error::ClickHouse did not start"
          exit 1

      # Also generates src/errorcodes.rs from the same checkout.
      - name: Get the upstream tests of ClickHouse ${{ steps.version.outputs.version }}
        id: upstream
        run: tests/clickhouse-test-runner/scripts/fetch-upstream.sh "${{ steps.version.outputs.version }}"

      # For the pinned version, the generated table must be the committed one.
      - name: Check the committed error code table
        if: steps.version.outputs.pinned == 'true'
        run: |
          file=tests/clickhouse-test-runner/src/errorcodes.rs
          if ! git diff --exit-code -- "${file}"; then
            echo "::error::${file} does not match the pinned version. Run scripts/fetch-upstream.sh and commit the file."
            exit 1
          fi

      # One run of the live tests covers both protocols, so one job runs
      # them.
      - name: Live tests of the harness
        if: matrix.protocol == 'http' && matrix.shard == 1
        working-directory: tests/clickhouse-test-runner
        env:
          CLICKHOUSE_TEST_RUNNER_LIVE: "1"
        run: cargo test live_tests

      - name: Run upstream SQL tests
        env:
          CLICKHOUSE_CLIENT_CLI_LOG: ${{ github.workspace }}/upstream-run.log
          CLICKHOUSE_TEST_RUNNER_PROTOCOL: ${{ matrix.protocol }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 4
        run: tests/clickhouse-test-runner/scripts/run-upstream-tests.sh -j 4

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sql-tests-${{ steps.upstream.outputs.ref }}-${{ matrix.protocol }}-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            upstream-run.log
            tests/clickhouse-test-runner/.upstream/ClickHouse/tests/queries/**/*.stdout
            tests/clickhouse-test-runner/.upstream/ClickHouse/tests/queries/**/*.stderr
